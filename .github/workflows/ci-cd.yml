name: CI/CD Pipeline - Build, Push & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:latest ./backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:${{ github.sha }} ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:latest ./frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:${{ github.sha }} ./frontend

      - name: Push Backend Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:${{ github.sha }}

      - name: Push Frontend Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Cloud VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VM_USERNAME }}/mean-app
            git pull origin main
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:latest
            docker compose down
            docker compose up -d
            docker image prune -f
