name: CI/CD Pipeline - Build, Push & Deploy

# Kab chalega ye pipeline?
# Jab bhi "main" branch pe code push hoga
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================
  # Job 1: Docker Images Build karo aur Push karo
  # ============================================
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # Step 1: Code checkout karo GitHub se
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Docker Hub mein login karo
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Backend Docker image build karo
      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:latest ./backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:${{ github.sha }} ./backend

      # Step 4: Frontend Docker image build karo
      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:latest ./frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:${{ github.sha }} ./frontend

      # Step 5: Images Docker Hub pe push karo
      - name: Push Backend Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:${{ github.sha }}

      - name: Push Frontend Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:${{ github.sha }}

  # ============================================
  # Job 2: VM pe deploy karo
  # Sirf push pe chalega, PR pe nahi
  # ============================================
  deploy:
    name: Deploy to Cloud VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      # VM pe SSH se connect karke deploy karo
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Project directory mein jao
            cd /home/${{ secrets.VM_USERNAME }}/mean-app

            # Latest code pull karo
            git pull origin main

            # Latest Docker images pull karo
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mean-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mean-frontend:latest

            # Purane containers band karo aur naye start karo
            docker compose down
            docker compose up -d

            # Purane unused images clean karo
            docker image prune -f

